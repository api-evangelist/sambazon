apis:
- name: SAMBAZON Storefront Agentic Commerce (UCP/MCP)
  description: 'The agent-facing commerce surface of the SAMBAZON online store. The
    merchant profile at /.well-known/ucp advertises the Universal Commerce Protocol
    (versions 2026-04-08 and 2026-01-23) over an MCP/JSON-RPC endpoint at /api/ucp/mcp,
    covering catalog search and lookup, cart, checkout, fulfillment, discount and order
    capabilities, plus Google Pay and Shopify card payment handlers. Anonymous tools/list
    is refused with JSON-RPC error -32001 (invalid_profile_url) — the live tool schemas
    require a registered UCP agent profile. Checkout completion requires contemporaneous
    human buyer approval.'
  humanURL: https://www.sambazon.com/agents.md
  baseURL: https://www.sambazon.com/api/ucp/mcp
  tags:
  - Agentic Commerce
  - Universal Commerce Protocol
  - MCP
  - E-Commerce
  tags_raw:
  - Agentic Commerce
  - Universal Commerce Protocol
  - Model Context Protocol
  - Ecommerce
  properties:
