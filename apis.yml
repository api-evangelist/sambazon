aid: sambazon
name: Sambazon
description: 'SAMBAZON (Sustainable Management of the Brazilian Amazon) is a San Clemente,
  California organic açaí food and beverage company founded in 2000, selling frozen
  açaí bowls, smoothie packs, bowl blends and juices through grocery, food service
  and its own direct-to-consumer store in 45+ countries. It is not a software vendor
  and publishes no developer program, but its Shopify-hosted storefront at www.sambazon.com
  exposes a real, public, machine-readable agentic-commerce surface: an llms.txt and
  agents.md agent instruction set, a Universal Commerce Protocol (UCP) merchant profile
  at /.well-known/ucp, a UCP/MCP JSON-RPC endpoint at /api/ucp/mcp, Shopify customer-account
  OpenID Connect metadata, and read-only storefront product/collection JSON endpoints.'
