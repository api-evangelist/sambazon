  - type: OAuthScopes
    url: scopes/sambazon-scopes.yml
  - type: ErrorCatalog
    url: errors/sambazon-problem-types.yml
  - type: Conventions
    url: conventions/sambazon-conventions.yml
- name: SAMBAZON Storefront Product JSON
  description: 'Read-only, unauthenticated Shopify storefront JSON endpoints published
    on the SAMBAZON store host and named in its own agents.md/llms.txt: /products.json,
    /products/{handle}.json, /collections/{handle}/products.json and /search/suggest.json.
    These return the live product catalog — titles, handles, descriptions, variants,
    prices and images — with no credentials required, and are the surface agents use
    for browsing when they are not transacting.'
  humanURL: https://www.sambazon.com/llms.txt
  baseURL: https://www.sambazon.com
