standards:
  - id: ucp
    name: Universal Commerce Protocol
    version: '2026-04-08'
    conforms: true
    evidence: >-
      https://www.sambazon.com/.well-known/ucp returns 200 application/json
      with a well-formed UCP merchant profile — ucp.version 2026-04-08,
      supported_versions, services.dev.ucp.shopping with an mcp transport and
      endpoint, seven capabilities plus the dev.shopify.catalog extension, and
      two payment_handlers.
    spec: https://ucp.dev/2026-04-08/specification/overview/
  - id: mcp
    name: Model Context Protocol
    conforms: partial
    evidence: >-
      https://www.sambazon.com/api/ucp/mcp is a live MCP transport endpoint
      declared in the UCP profile and answers JSON-RPC. It refuses anonymous
      tools/list and initialize with -32001, so full MCP handshake conformance
      could not be verified without a registered UCP agent profile.
  - id: jsonrpc-2.0
    name: JSON-RPC 2.0
    conforms: true
    evidence: >-
      The MCP endpoint returns a spec-shaped JSON-RPC 2.0 error object —
      {"jsonrpc":"2.0","id":1,"error":{"code":-32001,...}} — echoing the request
      id and using an implementation-defined code in the reserved server-error
      range.
  - id: oidc
    name: OpenID Connect Discovery 1.0
    conforms: true
    evidence: >-
      https://www.sambazon.com/.well-known/openid-configuration returns 200 with
      issuer, authorization_endpoint, token_endpoint, jwks_uri,
      response_types_supported, subject_types_supported and
      id_token_signing_alg_values_supported — all required fields present.
  - id: oauth2
    name: OAuth 2.0 Authorization Server Metadata (RFC 8414)
    conforms: true
    evidence: >-
      https://www.sambazon.com/.well-known/oauth-authorization-server returns
      200 with the same metadata document.
  - id: rfc9728
    name: OAuth 2.0 Protected Resource Metadata (RFC 9728)
    conforms: true
    evidence: >-
      https://www.sambazon.com/.well-known/oauth-protected-resource returns 200
      with resource, authorization_servers and bearer_methods_supported.
  - id: rfc7636
    name: PKCE (RFC 7636)
    conforms: true
    evidence: code_challenge_methods_supported is ["S256"] in the OIDC metadata.
  - id: llmstxt
    name: llms.txt
    conforms: true
    evidence: >-
      https://www.sambazon.com/llms.txt returns 200 text/markdown, 4373 bytes,
