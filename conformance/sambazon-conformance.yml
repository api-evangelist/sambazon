  - id: hsts
    name: HTTP Strict Transport Security (RFC 6797)
    conforms: true
    evidence: 'strict-transport-security: max-age=7889238 observed on responses.'
  - id: rfc9116
    name: security.txt
    conforms: false
    evidence: >-
